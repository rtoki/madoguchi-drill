<title>証明書窓口ドリル — PHOTO / SOUND</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Yomogi&display=swap">
<style>
/* Layout: ADV。1画面のステージに窓口の背景・来庁者の立ち絵・カウンター。下にメッセージウィンドウ、中央に選択肢、右に端末と申請書のウィンドウ。配色は MADO 配色規定の form パレット */
:root{
  --page:#D9E1E8; --ink:#16222D; --muted:#4E5E6D;
  --navy:#002C56; --on-navy:#FFFFFF; --accent:#4A82B8; --head:#002C56;
  --judge:#2E7F86; --hold:#B88A14; --ng:#8A5A3B; --ok:#2B7A57; --status:#B3261E;
  --judge-tint:#E2F0F0; --hold-tint:#FBF2D6; --ng-tint:#F3E8DF; --ok-tint:#E3F2EA; --status-tint:#FCE6E3; --tint:#E7ECF1;
  --wall:#E9EEF2; --wall-seam:#DCE3E9; --wall-low:#D2DBE3; --floor-shadow:rgba(0,30,60,.10);
  --ct-top:#DCCDB2; --ct-edge:#B6A383; --ct-front:#C9B796; --ct-shadow:rgba(60,40,20,.18);
  --glass:rgba(255,255,255,.18); --glass-hi:rgba(255,255,255,.55); --glass-edge:rgba(120,150,180,.55);
  --led-bg:#0B1218; --led-fg:#8FE0CF; --bezel:#1C2732;
  --mw-bg:rgba(0,26,52,.88); --mw-ink:#F2F6FA; --mw-dim:#B9C8D8; --mw-line:rgba(150,190,230,.45);
  --plate:#4A82B8; --plate-judge:#2E7F86;
  --choice-bg:rgba(251,253,255,.95); --choice-ink:#16222D; --choice-line:#8EA3B8;
  --screen:#F7FAFC; --screen-ink:#16222D; --screen-line:#D3DDE6;
  --paper:#FFFEFA; --paper-ink:#1D2630; --paper-line:#5E6B78; --paper-sub:#5E6B78; --hand:#1C3F8F;
  --card:#FBFCFD; --card-ink:#2A3440; --card-line:#B8C4CF; --card-photo:#C9D4DE;
  --band-a:#4A82B8; --band-b:#2E7F86; --band-c:#8EA3B8; --band-d:#B88A14; --book:#3F6A93;
  --hanko:#8A5A3B;
  --ceil:#F3F6F8; --ceil-light:rgba(255,255,255,.98); --floor:#C9D3DC; --floor2:#BAC6D1; --chair:#6F86A0; --chair-hi:#879DB5; --sil:rgba(36,56,78,.34); --hang:#FFFFFF; --hang-ink:#002C56; --clock-face:#FFFFFF; --clock-ink:#1D2630;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-disp:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --f-mono:"BIZ UDGothic","Osaka-Mono","MS Gothic",ui-monospace,monospace;
  --f-hand:"Yomogi","Klee One","Hiragino Maru Gothic ProN",cursive;
  --mw-h:30%; --ct-h:15%; --sx:40%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#070C11; --ink:#E4EBF2; --muted:#A3B3C2; --head:#A9CBEE;
  --judge-tint:#13302F; --hold-tint:#30280F; --ng-tint:#33241B; --ok-tint:#132E20; --status-tint:#3A1715; --tint:#1A2938;
  --wall:#1A2633; --wall-seam:#202E3C; --wall-low:#16212C; --floor-shadow:rgba(0,0,0,.3);
  --ct-top:#5E503D; --ct-edge:#3E3427; --ct-front:#4C4031; --ct-shadow:rgba(0,0,0,.35);
  --glass:rgba(160,200,240,.06); --glass-hi:rgba(190,215,240,.18); --glass-edge:rgba(150,180,210,.3);
  --choice-bg:rgba(20,32,43,.95); --choice-ink:#E4EBF2; --choice-line:#40586F;
  --screen:#0F1A24; --screen-ink:#E4EBF2; --screen-line:#26384A;
  --ceil:#111B25; --ceil-light:rgba(200,225,255,.30); --floor:#121C26; --floor2:#0F1820; --chair:#2B3D50; --chair-hi:#34495F; --sil:rgba(150,180,210,.16); --hang:#1C2A38; --hang-ink:#C9DCEF; --clock-face:#D9E1E8; --clock-ink:#16222D;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#070C11; --ink:#E4EBF2; --muted:#A3B3C2; --head:#A9CBEE;
  --judge-tint:#13302F; --hold-tint:#30280F; --ng-tint:#33241B; --ok-tint:#132E20; --status-tint:#3A1715; --tint:#1A2938;
  --wall:#1A2633; --wall-seam:#202E3C; --wall-low:#16212C; --floor-shadow:rgba(0,0,0,.3);
  --ct-top:#5E503D; --ct-edge:#3E3427; --ct-front:#4C4031; --ct-shadow:rgba(0,0,0,.35);
  --glass:rgba(160,200,240,.06); --glass-hi:rgba(190,215,240,.18); --glass-edge:rgba(150,180,210,.3);
  --choice-bg:rgba(20,32,43,.95); --choice-ink:#E4EBF2; --choice-line:#40586F;
  --screen:#0F1A24; --screen-ink:#E4EBF2; --screen-line:#26384A;
  --ceil:#111B25; --ceil-light:rgba(200,225,255,.30); --floor:#121C26; --floor2:#0F1820; --chair:#2B3D50; --chair-hi:#34495F; --sil:rgba(150,180,210,.16); --hang:#1C2A38; --hang-ink:#C9DCEF; --clock-face:#D9E1E8; --clock-ink:#16222D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stage{position:relative;flex:1 1 auto;min-height:600px;width:100%;max-width:1200px;margin:0 auto;border-radius:10px;overflow:hidden;
  isolation:isolate;user-select:none;-webkit-user-select:none;background:var(--wall);box-shadow:0 20px 50px -30px rgba(0,20,40,.6)}

/* scene */
.wall{position:absolute;inset:0;z-index:0;
  background:repeating-linear-gradient(90deg,transparent 0 139px,var(--wall-seam) 139px 141px),linear-gradient(var(--wall),var(--wall))}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--mw-h) + var(--ct-h));height:14%;background:var(--wall-low);border-top:2px solid var(--wall-seam)}
.sign{position:absolute;z-index:0;top:11%;left:var(--sx);transform:translateX(-50%);background:var(--navy);color:var(--on-navy);
  font-family:var(--f-disp);font-size:clamp(14px,1.7vw,19px);letter-spacing:.32em;padding:7px 16px 7px 24px;border-radius:3px;white-space:nowrap;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 14px -10px rgba(0,0,0,.6)}
.sign i{font-style:normal;font-family:var(--f-mono);letter-spacing:0;width:26px;height:26px;border-radius:50%;background:var(--on-navy);color:var(--navy);display:grid;place-items:center;font-size:14px}
.led{position:absolute;z-index:0;top:24%;left:3.5%;background:var(--led-bg);border:4px solid var(--bezel);border-radius:6px;padding:6px 14px 4px;text-align:center;min-width:120px}
.led small{display:block;color:#9FB3C4;font-size:10px;letter-spacing:.18em}
.led b{display:block;font-family:var(--f-mono);font-size:34px;line-height:1.1;color:var(--led-fg);text-shadow:0 0 10px rgba(143,224,207,.7);letter-spacing:.08em}
.poster{position:absolute;z-index:0;top:40%;right:4%;width:128px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--card-line);padding:10px 10px 12px;transform:rotate(1.6deg);font-size:12px;line-height:1.5;box-shadow:0 8px 14px -10px rgba(0,0,0,.4)}
.poster::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.poster b{display:block;font-family:var(--f-disp);font-size:14px;color:var(--navy);margin-bottom:6px}
.poster .ids{display:flex;gap:4px;margin-top:8px}
.poster .ids span{width:30px;height:19px;border-radius:2px;background:var(--card);border:1px solid var(--card-line);border-top:4px solid var(--band-a)}
.poster .ids span+span{border-top-color:var(--band-b)}
.poster .ids span+span+span{border-top-color:var(--band-c)}

.sprite{position:absolute;z-index:1;left:var(--sx);bottom:calc(var(--mw-h) + var(--ct-h) * .3);height:58%;aspect-ratio:240/300;transform:translateX(-50%)}
.sprite svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 16px rgba(0,20,40,.18))}
.sprite.enter{animation:enter .55s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translate(-50%,10%);opacity:.0}to{transform:translateX(-50%);opacity:1}}
.glass{position:absolute;z-index:2;left:calc(var(--sx) - 30%);width:60%;top:21%;bottom:calc(var(--mw-h) + var(--ct-h) + 1.6%);
  border:1px solid var(--glass-edge);border-bottom:0;border-radius:4px 4px 0 0;pointer-events:none;
  background:linear-gradient(115deg,transparent 0 26%,var(--glass-hi) 26.5% 28%,transparent 28.5% 63%,var(--glass-hi) 63.5% 64.2%,transparent 64.7%),var(--glass)}
.counter{position:absolute;z-index:3;left:0;right:0;bottom:var(--mw-h);height:var(--ct-h);
  background:linear-gradient(var(--ct-top) 0 36%,var(--ct-edge) 36% 41%,var(--ct-front) 41% 100%);box-shadow:0 -6px 16px -10px var(--ct-shadow)}
.docs{position:absolute;z-index:4;left:var(--sx);transform:translateX(-50%);bottom:calc(var(--mw-h) + var(--ct-h) * .08);display:flex;gap:14px;align-items:flex-end}
.docs.in{animation:docs .4s ease-out}
@keyframes docs{from{transform:translate(-50%,14px)}to{transform:translateX(-50%)}}
.item{margin:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;cursor:zoom-in;transition:transform .15s}
.item:hover,.item:focus-visible{transform:translateY(-4px)}
.item:hover figcaption{background:var(--navy);color:var(--on-navy)}
.docs-hint{position:absolute;z-index:4;left:2.5%;bottom:calc(var(--mw-h) + 8px);font-size:10.5px;color:var(--ink);opacity:.75;white-space:nowrap;pointer-events:none}
.item .g{position:relative;transform:rotate(var(--rot));background:var(--card);border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.12),0 8px 10px -6px rgba(0,0,0,.45);width:64px;height:40px;border:1px solid var(--card-line)}
.item .g i{position:absolute;left:5px;top:9px;width:14px;height:20px;background:var(--card-photo);border-radius:2px}
.item .g b{position:absolute;left:24px;right:6px;height:3px;background:var(--card-line);border-radius:2px}
.item .g b:nth-of-type(1){top:11px}.item .g b:nth-of-type(2){top:18px}.item .g b:nth-of-type(3){top:25px;right:18px}
.item.lic .g{border-top:6px solid var(--band-a)}
.item.mn .g{border-top:6px solid var(--band-b)}
.item.ins .g{border-top:6px solid var(--band-c)} .item.ins .g i{display:none} .item.ins .g b{left:7px}
.item.reg .g{width:52px;height:32px;border-top:5px solid var(--band-d)} .item.reg .g i{display:none} .item.reg .g b{left:7px}
.item.paper .g{width:42px;height:54px;border-radius:2px} .item.paper .g i{display:none} .item.paper .g b{left:6px;right:6px}
.item.paper .g::after{content:"";position:absolute;right:5px;bottom:6px;width:11px;height:11px;border:1.5px solid var(--hanko);border-radius:50%}
.item.book .g{width:40px;height:52px;background:var(--book);border-color:var(--book);border-radius:2px 4px 4px 2px} .item.book .g i{display:none}
.item.book .g b{left:8px;right:8px;background:rgba(255,255,255,.65)} .item.book .g b:nth-of-type(1){top:12px;height:8px}
.item figcaption{font-size:11px;line-height:1.3;color:var(--ink);text-align:center;background:color-mix(in srgb,var(--ct-front) 70%,transparent);padding:1px 4px;border-radius:3px}

/* realism: ceiling, lobby, hanging signs, clock */
.ceil{position:absolute;z-index:0;left:0;right:0;top:0;height:8.5%;background:var(--ceil);border-bottom:1px solid var(--wall-seam)}
.ceil::before{content:"";position:absolute;left:0;right:0;top:42%;height:16%;opacity:.75;border-radius:2px;
  background:repeating-linear-gradient(90deg,transparent 0 6%,var(--ceil-light) 6% 20%,transparent 20% 26%);filter:blur(.4px);box-shadow:0 6px 18px rgba(255,255,255,.25)}
.lobby{position:absolute;z-index:0;left:0;right:0;top:37%;bottom:calc(var(--mw-h) + var(--ct-h));
  background:linear-gradient(var(--floor2),var(--floor))}
.lobby::before{content:"";position:absolute;left:0;right:0;bottom:6%;height:22%;
  background:repeating-linear-gradient(90deg,var(--chair) 0 7.2%,var(--chair-hi) 7.2% 7.6%,transparent 7.6% 8.4%);border-radius:3px;opacity:.9}
.sil{position:absolute;z-index:0;bottom:calc(var(--mw-h) + var(--ct-h) + 3%);width:4.6%;aspect-ratio:1/1.5;filter:blur(1.2px)}
.sil::before{content:"";position:absolute;left:24%;top:0;width:52%;aspect-ratio:1;border-radius:50%;background:var(--sil)}
.sil::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;border-radius:40% 40% 8% 8%;background:var(--sil)}
.hang{position:absolute;z-index:0;top:10%;display:flex;gap:1.4%;left:var(--sx);transform:translateX(-50%);align-items:flex-start}
.hang::before{content:"";position:absolute;left:8%;right:8%;top:-1.6vh;height:1.6vh;border-left:1px solid var(--wall-seam);border-right:1px solid var(--wall-seam)}
.hs{background:var(--hang);color:var(--hang-ink);border:1px solid var(--wall-seam);border-radius:3px;font-size:clamp(10px,1.1vw,13px);padding:4px 10px;white-space:nowrap;display:flex;gap:6px;align-items:center;opacity:.85;margin-top:6px}
.hs i{font-style:normal;font-family:var(--f-mono);width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px}
.hang .sign{position:static;transform:none}
.clock{position:absolute;z-index:0;top:24%;right:7%;width:62px;height:62px}
.clock svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.led .wait{display:block;font-size:10px;color:#9FB3C4;border-top:1px solid #23313D;margin-top:3px;padding-top:2px;letter-spacing:.1em}
.led .wait b{display:inline;font-size:12px;color:#E7B98F;text-shadow:none;letter-spacing:0}
/* HUD */
.hud{position:absolute;z-index:6;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-l{display:flex;align-items:center;gap:10px;background:var(--mw-bg);color:var(--mw-ink);border:1px solid var(--mw-line);border-radius:6px;padding:5px 12px}
.hud-l .no{font-family:var(--f-mono);color:var(--led-fg);font-size:18px;letter-spacing:.06em}
.hud-l .n{font-size:12px;color:var(--mw-dim)}
.dots{display:flex;gap:5px;align-items:center}
.dots span{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mw-dim)}
.dots .ok{background:var(--led-fg);border-color:var(--led-fg)}
.dots .ng{background:#C99472;border-color:#C99472}
.dots .now{border-color:var(--on-navy);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.hud-r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meter{background:var(--mw-bg);color:var(--mw-ink);border:1px solid var(--mw-line);border-radius:6px;padding:3px 10px;display:flex;align-items:baseline;gap:6px;font-size:11px}
.meter b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.meter.warn b{color:#E7B98F}

/* windows (terminal / form) */
.win{position:absolute;z-index:5;top:56px;right:12px;width:min(372px,calc(100% - 24px));max-height:calc(100% - var(--mw-h) - 72px);display:flex;flex-direction:column;
  border:6px solid var(--bezel);border-radius:9px;background:var(--screen);color:var(--screen-ink);box-shadow:0 18px 30px -16px rgba(0,0,0,.55)}
.win.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:translateY(-8px)}to{transform:none}}
.win-tabs{display:flex;align-items:stretch;background:var(--bezel)}
.win-tabs button{flex:1;padding:6px 10px;font-size:12px;letter-spacing:.08em;color:#9FB3C4;border-radius:5px 5px 0 0}
.win-tabs button[aria-pressed="true"]{background:var(--screen);color:var(--screen-ink);font-weight:700}
.win-tabs .x{flex:0 0 34px;color:#C9D6E2;font-size:16px}
.win-body{overflow-y:auto;min-height:0}
.term-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--screen-line);font-size:12px}
.term-bar b{background:var(--navy);color:var(--on-navy);padding:1px 8px;border-radius:3px;font-size:11px;letter-spacing:.1em}
.term-bar .q{flex:1;font-family:var(--f-mono);border:1px solid var(--screen-line);border-radius:3px;padding:2px 8px;background:var(--paper);color:var(--paper-ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win dl{margin:0;padding:4px 12px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;font-size:13px}
.win dt{color:var(--muted);padding:6px 0;border-bottom:1px dotted var(--screen-line);white-space:nowrap}
.win dd{margin:0;padding:6px 0;border-bottom:1px dotted var(--screen-line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;overflow-wrap:anywhere}
.win .empty{padding:14px;color:var(--muted);font-size:13px;margin:0}
.tag{display:inline-flex;align-items:center;font-size:11px;line-height:1.4;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap;color:var(--ink)}
.tag.ok{background:var(--ok-tint);border-color:var(--ok)} .tag.hold{background:var(--hold-tint);border-color:var(--hold)}
.tag.ng{background:var(--ng-tint);border-color:var(--ng)} .tag.plan{background:var(--tint);border-color:var(--accent);border-style:dashed}
.tag.status{background:var(--status-tint);border-color:var(--status);color:var(--status);font-weight:700}

/* 申請書 */
.paper{margin:10px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);padding:12px 12px 14px;font-size:11.5px;line-height:1.45;position:relative}
.f-title{font-family:var(--f-disp);font-size:16px;text-align:center;letter-spacing:.2em;border-bottom:3px double var(--paper-line);padding-bottom:4px;margin-bottom:6px}
.f-to{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:11px}
.paper h6{margin:8px 0 3px;font-size:11.5px;font-weight:700}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper th,.paper td{border:1px solid var(--paper-line);padding:3px 5px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
.paper th{width:58px;font-weight:400;color:var(--paper-sub);background:color-mix(in srgb,var(--paper-line) 8%,transparent);font-size:10.5px}
.paper .pr{font-family:var(--f-mono)}
.paper .kana{display:block;font-size:9.5px;color:var(--paper-sub)}
.paper .hand{font-family:var(--f-hand);color:var(--hand);font-size:14px;line-height:1.2}
.paper .sig{height:30px}
.paper .mask{display:inline-block;font-size:10px;color:var(--paper-sub);border:1px dashed var(--paper-line);padding:0 5px;border-radius:2px}
.paper .boxes{font-size:10.5px;line-height:1.7}
.paper .boxes span{margin-right:8px;white-space:nowrap}
.paper .on{font-weight:700}
.paper .num{text-align:center;font-family:var(--f-mono);width:44px}
.paper s{color:var(--paper-sub)}
.paper .fixnote{font-family:var(--f-hand);color:var(--hand);font-size:15px;margin-left:4px}
.paper .blank{color:transparent}
.f-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
.hbox{width:58px;height:62px;border:1px solid var(--paper-line);display:flex;flex-direction:column;align-items:center}
.hbox span{font-size:10px;color:var(--paper-sub);border-bottom:1px solid var(--paper-line);width:100%;text-align:center}
.hanko{margin-top:4px;width:40px;height:40px;border:2px solid var(--hanko);border-radius:50%;color:var(--hanko);display:grid;place-items:center;font-family:var(--f-disp);font-size:11px;line-height:1.05;text-align:center;transform:rotate(-8deg)}
.hanko.in{animation:hanko .5s ease-out}
@keyframes hanko{0%{transform:scale(1.8) rotate(-8deg);opacity:0}60%{transform:scale(.95) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.paper .lead{font-size:11px;margin:8px 0}
.paper .fillin{display:inline-block;min-width:9em;border-bottom:1px solid var(--paper-line);height:1.3em;vertical-align:bottom}
.paper .callout{display:block;font-family:var(--f-hand);color:var(--hand);font-size:13.5px;line-height:1.3;margin:2px 0 0}
.paper .circ{border:1.5px solid var(--hand);border-radius:50%;padding:0 4px}
.paper ol.need{margin:6px 0;padding-left:1.4em;display:grid;gap:6px;font-size:12px}
.paper ol.need li b{font-weight:700}
.paper .warnbox{border:1px solid var(--paper-line);padding:6px 8px;font-size:11px;margin-top:8px}
.handstamp{position:absolute;right:14px;top:44px;font-family:var(--f-hand);color:var(--hand);font-size:12px;transform:rotate(-4deg);text-align:right;line-height:1.3}
.f-note{font-size:10px;color:var(--paper-sub);margin:8px 10px 10px}

/* zoom */
.zoom{position:absolute;z-index:10;inset:0;background:rgba(5,15,28,.72);display:grid;place-items:center;padding:56px 16px 16px;overflow-y:auto;animation:fade .25s ease-out}
.zoom-in{display:grid;gap:12px;justify-items:center;width:min(560px,100%)}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;color:#E4EBF2;font-size:13px}
.zoom-bar .nav{display:flex;gap:6px}
.zoom .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}
.zoom .tip{color:#B9C8D8;font-size:12px;text-align:center;max-width:36em}
.idc{position:relative;width:100%;aspect-ratio:1.586;border-radius:16px;background:linear-gradient(135deg,#FBFCFD 0%,#EEF3F7 55%,#F7F9FB 100%);color:#1D2630;
  box-shadow:0 30px 60px -24px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;padding:5% 5.5%;display:grid;grid-template-columns:minmax(0,1fr) 27%;gap:3% 4%;align-content:start;font-size:clamp(10px,2.3vw,13px)}
.idc::after{content:"見本";position:absolute;right:30%;bottom:9%;font-family:var(--f-disp);font-size:clamp(20px,6vw,40px);color:rgba(138,90,59,.28);border:3px solid rgba(138,90,59,.28);padding:0 10px;transform:rotate(-14deg);letter-spacing:.2em;pointer-events:none}
.idc .hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--band, #4A82B8);padding-bottom:3%;font-family:var(--f-disp);font-size:clamp(14px,3.2vw,19px);letter-spacing:.14em}
.idc .hd small{font-family:var(--f-body);font-size:.6em;letter-spacing:.06em;color:#5E6B78}
.idc dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4% 10px;align-content:start}
.idc dt{color:#5E6B78;font-size:.85em;white-space:nowrap}
.idc dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}
.idc .ph{border-radius:6px;overflow:hidden;background:#DCE5EC;aspect-ratio:3/4;align-self:start}
.idc .ph svg{width:100%;height:100%;display:block}
.idc .ft{grid-column:1/-1;font-size:.8em;color:#5E6B78;display:flex;justify-content:space-between;gap:8px;margin-top:auto}
.idc.reg{aspect-ratio:1.586;grid-template-columns:1fr}
.idc.reg .big{font-family:var(--f-mono);font-size:clamp(18px,5vw,30px);text-align:center;letter-spacing:.1em;margin:6% 0 2%}
.bookz{width:min(460px,100%);display:grid;grid-template-columns:1fr 1fr;box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
.bookz>div{background:#FBFCFD;color:#1D2630;padding:18px 16px;min-height:240px;font-size:12.5px;position:relative}
.bookz>div:first-child{background:#3F6A93;color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--f-disp);font-size:20px;letter-spacing:.2em;border-radius:6px 0 0 6px}
.bookz>div:last-child{border-radius:0 6px 6px 0;border-left:2px solid #C9D4DE}
.bookz dl{margin:0;display:grid;gap:10px}
.bookz dt{color:#5E6B78;font-size:11px}.bookz dd{margin:0;font-family:var(--f-mono)}
.zoom .paper{width:100%;margin:0;font-size:13px;box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
.zoom .paper th{width:84px;font-size:11.5px}
/* message window */
.mw{position:absolute;z-index:6;left:1.6%;right:1.6%;bottom:2.4%;height:calc(var(--mw-h) - 4%);min-height:150px;background:var(--mw-bg);color:var(--mw-ink);
  border:1px solid var(--mw-line);border-radius:10px;outline:1px solid var(--mw-line);outline-offset:-7px;display:flex;gap:18px;padding:24px 26px 34px;backdrop-filter:blur(3px)}
.plate{position:absolute;top:-15px;left:24px;background:var(--plate);color:#fff;font-weight:700;font-size:14px;padding:3px 18px;border-radius:4px;letter-spacing:.06em;box-shadow:0 4px 10px -6px rgba(0,0,0,.6);display:flex;gap:8px;align-items:center}
.plate small{font-weight:400;font-size:11px;opacity:.85}
.plate.judge{background:var(--plate-judge)}
.plate.me{background:#5E6B78}
.plate.judge .ref{font-family:var(--f-mono)}
.face{flex:0 0 auto;width:96px;height:96px;border-radius:8px;overflow:hidden;background:var(--wall);border:2px solid var(--mw-line);align-self:center}
.face svg{width:100%;height:100%;display:block}
.mw-text{flex:1;min-width:0;overflow-y:auto;font-size:clamp(15px,1.55vw,18px);line-height:1.9;letter-spacing:.02em;white-space:pre-wrap}
.mw-text.narr{color:var(--mw-dim)}
.mw .ind{position:absolute;right:22px;bottom:30px;width:0;height:0;border:7px solid transparent;border-top:10px solid var(--led-fg);border-bottom:0;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ctrl{position:absolute;right:14px;bottom:6px;display:flex;gap:2px;font-size:11px;letter-spacing:.08em}
.ctrl button{color:var(--mw-dim);padding:3px 8px;border-radius:4px}
.ctrl button:hover{color:#fff;background:rgba(255,255,255,.08)}
.ctrl button[aria-pressed="true"]{color:var(--led-fg)}

/* choices */
.choices{position:absolute;z-index:7;left:var(--sx);transform:translateX(-50%);top:17%;width:min(600px,74%);display:grid;gap:10px;max-height:calc(100% - var(--mw-h) - 19%);overflow-y:auto;padding:4px}
.choices.in{animation:chin .3s ease-out}
@keyframes chin{from{transform:translate(-50%,8px)}to{transform:translateX(-50%)}}
.choice{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--choice-bg);color:var(--choice-ink);font-size:15px;line-height:1.55;padding:12px 26px 12px 22px;
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);box-shadow:inset 0 0 0 1px var(--choice-line)}
.choice:hover,.choice:focus-visible{background:var(--navy);color:var(--on-navy)}
.choice .k{flex:0 0 auto;font-family:var(--f-mono);font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;opacity:.8}
.consult{justify-self:center;display:flex;align-items:center;gap:8px;background:var(--mw-bg);color:var(--mw-ink);border:1px solid var(--mw-line);border-radius:999px;padding:4px 14px 4px 4px;font-size:13px}
.consult .mini{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--wall)}
.consult .mini svg{width:100%;height:100%;display:block}
.consult:disabled{opacity:.5;cursor:default}
.hintcard{background:var(--mw-bg);color:var(--mw-ink);border:1px solid var(--mw-line);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;gap:10px}
.hintcard .mini{flex:0 0 36px;height:36px;border-radius:50%;overflow:hidden;background:var(--wall)}
.hintcard .mini svg{width:100%;height:100%}

/* order */
.orderbox{position:absolute;z-index:7;left:var(--sx);transform:translateX(-50%);top:15%;width:min(620px,80%);max-height:calc(100% - var(--mw-h) - 17%);overflow-y:auto;
  background:var(--choice-bg);color:var(--choice-ink);border:1px solid var(--choice-line);border-radius:10px;padding:14px;display:grid;gap:10px}
.orderbox h5{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:400}
.picked{list-style:none;margin:0;padding:0;display:grid;gap:5px;counter-reset:n}
.picked li{counter-increment:n;display:flex;gap:10px;font-size:14px;padding:6px 10px;border:1px dashed var(--choice-line);border-radius:6px}
.picked li::before{content:counter(n);font-family:var(--f-mono);font-weight:700;color:var(--head);width:14px;flex-shrink:0}
.picked li.ph{color:transparent}
.pool{display:grid;gap:6px}
.pool button{text-align:left;font-size:14px;padding:8px 12px;border:1px solid var(--choice-line);border-radius:6px;background:var(--choice-bg)}
.pool button:hover{background:var(--navy);color:var(--on-navy)}
.obtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--choice-line);background:var(--choice-bg);color:var(--choice-ink);border-radius:6px;padding:8px 14px;font-size:14px;line-height:1.3}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}

/* stamp FX */
.stampfx{position:absolute;z-index:8;left:var(--sx);top:24%;width:150px;height:150px;margin-left:-75px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  font-family:var(--f-disp);font-size:34px;font-weight:700;letter-spacing:.06em;border:7px double;transform:rotate(-14deg);animation:stamp 1.5s ease-out forwards;background:rgba(255,255,255,.35)}
.stampfx.ok{color:var(--navy);border-color:var(--navy)}
.stampfx.ng{color:var(--ng);border-color:var(--ng);font-size:28px}
@keyframes stamp{0%{transform:scale(2) rotate(-14deg);opacity:0}14%{transform:scale(1) rotate(-14deg);opacity:1}75%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-14deg)}}

/* overlays */
.ov{position:absolute;inset:0;z-index:9;color:var(--on-navy)}
.card{display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 40% 45%,rgba(0,44,86,.82),rgba(0,18,36,.95));animation:fade .5s ease-out;cursor:pointer}
@keyframes fade{from{opacity:.0}to{opacity:1}}
.card .inner{display:grid;gap:10px;justify-items:center;padding:24px}
.card small{letter-spacing:.3em;font-size:12px;color:#B9C8D8}
.card .num{font-family:var(--f-mono);font-size:clamp(64px,10vw,110px);line-height:1;color:var(--led-fg);text-shadow:0 0 22px rgba(143,224,207,.55);letter-spacing:.08em}
.card h2{font-family:var(--f-disp);font-size:clamp(22px,3.2vw,34px);margin:6px 0 0;font-weight:700;text-wrap:balance;max-width:20em}
.card .meta{display:flex;gap:14px;font-size:13px;color:#B9C8D8;flex-wrap:wrap;justify-content:center}
.card .meta .lv{font-family:var(--f-mono);color:var(--led-fg);letter-spacing:.12em}
.card .go{margin-top:16px;font-size:12px;color:#B9C8D8;letter-spacing:.2em;animation:blink 1.4s steps(2) infinite}

.title{background:linear-gradient(90deg,rgba(0,26,52,.94) 0%,rgba(0,26,52,.80) 46%,rgba(0,26,52,.15) 78%,rgba(0,26,52,0));display:flex;align-items:center;overflow:hidden}
.title .key{position:absolute;right:2%;bottom:0;height:92%;aspect-ratio:240/300;z-index:-1}
.title .key svg{width:100%;height:100%}
.title .tx{position:relative;max-width:560px;padding:40px 6% 32px;display:grid;gap:16px;max-height:100%;overflow-y:auto}
.title .eyebrow{font-size:12px;letter-spacing:.24em;color:#B9C8D8}
.title h1{margin:0;font-family:var(--f-disp);font-size:clamp(38px,6.4vw,70px);line-height:1.12;letter-spacing:.04em;font-weight:700}
.title h1 span{display:block;font-size:.42em;letter-spacing:.3em;color:var(--led-fg);margin-bottom:8px;font-family:var(--f-mono);font-weight:400}
.title p{margin:0;color:#D5DFEA;font-size:14.5px;max-width:30em}
.menu{display:grid;gap:8px;max-width:340px}
.menu .mbtn{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;border:1px solid rgba(150,190,230,.5);border-radius:4px;font-size:15px;color:#fff;background:rgba(255,255,255,.04)}
.menu .mbtn:hover,.menu .mbtn:focus-visible{background:rgba(255,255,255,.14)}
.menu .mbtn.main{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy);font-weight:700;font-size:17px}
.menu .mbtn.main:hover{background:#DDE8F3}
.menu .mbtn em{font-style:normal;font-size:11px;letter-spacing:.14em;opacity:.7}
.opts{display:grid;gap:8px}
.opts .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opts .lbl{font-size:11px;letter-spacing:.16em;color:#B9C8D8;width:100%}
.chip{border:1px solid rgba(150,190,230,.5);border-radius:999px;padding:4px 12px;font-size:13px;color:#E4EBF2}
.chip[aria-pressed="true"]{background:var(--led-fg);border-color:var(--led-fg);color:#002C56;font-weight:700}
.title .best{font-size:12px;color:#B9C8D8}
.title .src{font-size:11.5px;color:#9FB3C4;max-width:36em}

.endov{background:linear-gradient(180deg,rgba(0,26,52,.92),rgba(0,14,28,.97));overflow-y:auto}
.end{max-width:920px;margin:0 auto;padding:44px 24px 32px;display:grid;gap:22px}
.end .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center}
.end .face{width:110px;height:110px}
.end small{letter-spacing:.24em;color:#B9C8D8;font-size:12px}
.end h1{margin:2px 0 6px;font-family:var(--f-disp);font-size:clamp(32px,5vw,50px);letter-spacing:.06em}
.end .say{margin:0;color:#E4EBF2;font-size:15px}
.ring{width:120px;height:120px}
.ring text{font-family:var(--f-mono)}
.estats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:rgba(150,190,230,.3);border:1px solid rgba(150,190,230,.3);border-radius:8px;overflow:hidden}
.estats div{background:rgba(0,26,52,.9);padding:12px 14px}
.estats dt{font-size:11px;letter-spacing:.12em;color:#B9C8D8}
.estats dd{margin:0;font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.bars h3,.faces h3,.misses h3{margin:0 0 6px;font-size:13px;letter-spacing:.16em;color:#B9C8D8;font-weight:400}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;border-radius:6px;background:rgba(150,190,230,.18);overflow:hidden}
.bar .fill{height:100%;background:var(--led-fg);border-radius:6px}
.bar .v{font-family:var(--f-mono);text-align:right}
.faces .row{display:flex;flex-wrap:wrap;gap:12px}
.vf{width:84px;display:grid;justify-items:center;gap:4px;font-size:11px;text-align:center;color:#D5DFEA}
.vf .pic{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--wall);border:2px solid rgba(150,190,230,.45)}
.vf .pic svg{width:100%;height:100%}
.vf .tag{color:var(--ink)}
.misses details{border-top:1px solid rgba(150,190,230,.3);padding:10px 0}
.misses summary{cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
