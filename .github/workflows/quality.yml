name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: game
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked development dependencies
        run: npm ci
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Compile the original manuscript
        run: python3 scripts/build.py manuscript
      - name: Build the original web game and starter
        run: |
          python3 scripts/build.py web
          python3 scripts/build.py standalone --scenario starter
      - name: Verify Python contracts
        run: python3 scripts/verify.py
      - name: Verify game behavior
        run: |
          for test in scripts/verify-*.cjs; do
            node "$test" || exit 1
          done
      - name: Check whitespace
        run: git diff --check
